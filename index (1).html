<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For My Blue 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet"/>

<style>
/* (KEEP YOUR ORIGINAL CSS — only additions below) */

/* 💙 NAME GLOW */
.name-text {
  animation: glowBlue 2.5s ease-in-out infinite alternate;
}

@keyframes glowBlue {
  from {
    text-shadow: 0 0 4px rgba(123,175,212,0.4);
  }
  to {
    text-shadow: 0 0 14px rgba(123,175,212,0.9),
                 0 0 22px rgba(123,175,212,0.6);
  }
}

/* ✍️ typing cursor */
.typing::after {
  content: "|";
  animation: blink 1s infinite;
  margin-left: 4px;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* 💙 extra hearts */
.love-heart {
  position: fixed;
  pointer-events: none;
  z-index: 60;
  font-size: 20px;
  animation: loveFloat 3s ease-out forwards;
  opacity: 0;
}

@keyframes loveFloat {
  0% { opacity: 0; transform: translateY(0) scale(0.6); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-260px) scale(1.3); }
}
</style>
</head>

<body>

<!-- 🔊 sounds -->
<audio id="openSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0b0c.mp3"></audio>
<audio id="chimeSound" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a73467.mp3"></audio>

<!-- KEEP YOUR ORIGINAL HTML ABOVE THIS LINE -->

<!-- ✍️ FULL LETTER BODY (REPLACE ONLY THIS PART INSIDE modal-body) -->
<div class="modal-body typing" id="typedText"></div>

<div class="modal-closing">
  I love you so much. ❤️
</div>
<div class="modal-signature">
  — From the person of your life, Neil
</div>

<script>

/* ✍️ TYPEWRITER CONTENT */
const letterText = `
14 months na tayo! 🫶 I'm so grateful sa lahat ng ginagawa mo for me, at higit sa lahat, sobrang thankful ako kay Lord kasi binigay ka Niya sa'kin.

Alam ko naging mahirap nitong mga nakaraang araw. Alam ko rin na marami akong pagkukulang at pagkakamali… pero gusto kong malaman mo na mamahalin kita palagi, at tatanggapin kita kung sino ka talaga.

Lahat ng nararamdaman mo ay valid. Hindi kita sisisihin sa kahit ano, lalo na sa mga pinagdaanan mong masasakit noon. Lagi kitang babantayan, kahit malayo ako.

"It is the time you have wasted for your rose that makes your rose so important." 🌹

At para sa'kin, ikaw 'yung rose ko — mahalaga ka dahil pinipili kitang mahalin araw-araw.

I love you always. Keep fighting, keep going after your dreams, darling. Tandaan mo, you're always doing great — and great is enough.
`;

/* ✍️ typing effect */
let i = 0;
function startTyping() {
  const el = document.getElementById("typedText");
  el.innerHTML = "";
  i = 0;

  function type() {
    if (i < letterText.length) {
      el.innerHTML += letterText.charAt(i);
      i++;
      setTimeout(type, 28);
    }
  }
  type();
}

/* 💙 enhanced open */
function openEnvelope() {
  if (opened) return;
  opened = true;

  document.getElementById('envelope').classList.add('opened');

  // 🔊 sounds
  openSound.play();
  setTimeout(() => chimeSound.play(), 600);

  burstSparkles();
  burstLoveHearts();

  setTimeout(() => {
    openModal();
    startTyping(); // ✍️ trigger typing
  }, 2200);
}

/* 💙 sweet hearts */
function burstLoveHearts() {
  const hearts = ['💙','💖','💗','💞','🫶','💘','❤️'];

  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'love-heart';
      el.textContent = hearts[Math.floor(Math.random()*hearts.length)];

      el.style.left = (45 + Math.random()*10) + 'vw';
      el.style.top = (55 + Math.random()*10) + 'vh';

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 80);
  }
}

</script>

</body>
</html>
